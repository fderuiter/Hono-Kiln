name: PR Gatekeeper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Detect duplicate code
        run: bun x jscpd .

      - name: Lint
        run: bun x --bun oxlint .

      - name: Audit codebase health
        run: bun kiln audit

      - name: Verify migration metadata integrity
        run: cd packages/api && bun x drizzle-kit check

      - name: Verify schema drift
        run: |
          cd packages/api
          bun db:migrate
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Database schema drift detected. Please run 'drizzle-kit generate' and commit the resulting migration files."
            git status --porcelain
            exit 1
          fi

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.90.5
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown
