name: PR Gatekeeper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/rw-validate.yml

  secret-scan:
    name: TruffleHog Secret Scan
    if: false
    uses: ./.github/workflows/rw-secret-scan.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
