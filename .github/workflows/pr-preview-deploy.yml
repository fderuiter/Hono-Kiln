name: PR Preview Deployment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    if: secrets.CLOUDFLARE_API_TOKEN != ''
    uses: ./.github/workflows/rw-guard.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-preview:
    name: Deploy Preview
    needs: guard
    if: github.event.action != 'closed' && needs.guard.outputs.has-secrets == 'true'
    uses: ./.github/workflows/rw-deploy.yml
    with:
      action: deploy
      worker_name: hono-kiln-pr-${{ github.event.pull_request.number }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  remove-preview:
    name: Remove Preview
    needs: guard
    if: github.event.action == 'closed' && needs.guard.outputs.has-secrets == 'true'
    uses: ./.github/workflows/rw-deploy.yml
    with:
      action: remove
      worker_name: hono-kiln-pr-${{ github.event.pull_request.number }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
