name: PR Preview Deployment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: TruffleHog Secret Scan
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.90.5
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

  deploy-preview:
    name: Deploy Preview
    needs: secret-scan
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.extract-url.outputs.url }}
    steps:
      - name: Check secrets
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.has-secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.check.outputs.has-secrets == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy with Wrangler
        if: steps.check.outputs.has-secrets == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/api
          secrets: |
            DATABASE_URL
            DATABASE_AUTH_TOKEN
          command: >-
            deploy
            --name hono-kiln-pr-${{ github.event.pull_request.number }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}

      - name: Extract URL
        if: steps.check.outputs.has-secrets == 'true'
        id: extract-url
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          URL=$(echo "$WRANGLER_OUTPUT" | grep -Eo 'https://[^ ]+' | head -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.check.outputs.has-secrets == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.extract-url.outputs.url }}
          WORKER_NAME: hono-kiln-pr-${{ github.event.pull_request.number }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = url
              ? `✅ Preview deployment is live: ${url}`
              : `✅ Preview deployment completed for worker \`${process.env.WORKER_NAME}\`.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  a11y-scan:
    name: Accessibility Scan
    needs: deploy-preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build architecture docs
        run: |
          bun run docs
          node scripts/fix-a11y.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run pa11y-ci
        id: pa11y
        run: |
          echo '{"defaults":{"standard":"WCAG2AA","runners":["axe","htmlcs"]}}' > .pa11yci
          
          npx serve -p 8080 docs &
          SERVE_PID=$!
          sleep 3
          
          URLS="http://localhost:8080"
          if [ -n "${{ needs.deploy-preview.outputs.preview_url }}" ]; then
            URLS="$URLS ${{ needs.deploy-preview.outputs.preview_url }}/docs"
          fi
          
          npx pa11y-ci $URLS > a11y-report.txt || echo "A11Y_FAILED=true" >> "$GITHUB_ENV"
          
          kill $SERVE_PID
          cat a11y-report.txt
      - name: Comment accessibility report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('a11y-report.txt', 'utf8');
            const body = `### ♿ Accessibility Report\n\n\`\`\`\n${report}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Check for violations
        if: env.A11Y_FAILED == 'true'
        run: |
          echo "Accessibility violations found! Please check the report."
          exit 1

  remove-preview:
    name: Remove Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove worker deployment
        if: steps.check.outputs.has-secrets == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/api
          command: delete hono-kiln-pr-${{ github.event.pull_request.number }} --force
